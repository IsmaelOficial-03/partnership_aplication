<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeHosting - Partnership Application</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #13151b;
            --input-bg: #1c1f26;
            --border-color: #2a2e39;
            --text-color: #e1e1e6;
            --text-muted: #8f9ba8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .brand-title {
            color: var(--accent-color);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .header h1 {
            font-size: 1.8rem;
            margin: 8px 0;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .section-title {
            font-size: 1.1rem;
            margin: 20px 0 15px 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .status-msg.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .status-msg.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-title">LifeHosting</div>
        <h1>Partnership Application</h1>
        <p>Completa este formulario en detalle para poder evaluar si tu proyecto encaja con la visión de LifeHosting y brindarte nuestro apoyo institucional.</p>
    </div>

    <form id="partnerForm">
        <!-- Información Personal -->
        <div class="section-title">1. Información Personal</div>
        <div class="form-row">
            <div class="form-group">
                <label for="nombre">Nombre Completo *</label>
                <input type="text" id="nombre" placeholder="¿Cómo deberíamos llamarte?" required>
            </div>
            <div class="form-group">
                <label for="edad">Tu Edad *</label>
                <input type="number" id="edad" placeholder="¿Cuántos años tienes?" required min="13">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="discordTag">Discord User / Tag *</label>
                <input type="text" id="discordTag" placeholder="Ej: usuario o usuario#0000" required>
            </div>
            <div class="form-group">
                <label for="discordID">Discord ID (Opcional)</label>
                <input type="text" id="discordID" placeholder="Tu ID numérico de Discord">
            </div>
        </div>

        <!-- Sobre tu Proyecto -->
        <div class="section-title">2. Sobre tu Proyecto</div>
        <div class="form-group">
            <label for="proyectoNombre">Nombre de la Organización / Proyecto *</label>
            <input type="text" id="proyectoNombre" placeholder="Nombre de la comunidad o proyecto" required>
        </div>
        <div class="form-group">
            <label for="redes">Enlaces y Redes Sociales *</label>
            <textarea id="redes" placeholder="Pega enlaces de tu canal de YouTube, Twitch, TikTok, Sitio web o servidor de Discord..." required></textarea>
        </div>
        <div class="form-group">
            <label for="descripcion">Cuéntanos sobre tu organización / comunidad *</label>
            <textarea id="descripcion" placeholder="¿Quiénes son? ¿En qué consiste su comunidad? Cuéntanos en detalle..." required></textarea>
        </div>

        <!-- Objetivos y Colaboración -->
        <div class="section-title">3. Objetivos y Colaboración</div>
        <div class="form-group">
            <label for="planInteres">Plan de Interés en LifeHosting *</label>
            <select id="planInteres" required>
                <option value="" disabled selected>Por favor, selecciona un servicio</option>
                <option value="Hosting Minecraft">Hosting Minecraft</option>
                <option value="Servidor VPS">Servidor VPS</option>
                <option value="Servidor Dedicado">Servidor Dedicado</option>
                <option value="Web Hosting">Web Hosting</option>
                <option value="Otro">Otro servicio</option>
            </select>
        </div>
        <div class="form-group">
            <label>¿Estás buscando financiamiento completo para tu proyecto? *</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="financiamiento" value="Sí" required> Sí
                </label>
                <label class="radio-option">
                    <input type="radio" name="financiamiento" value="No, solo buscando descuento"> No, solo buscando un descuento
                </label>
            </div>
        </div>
        <div class="form-group">
            <label for="razonPartner">¿Por qué buscas ser partner de LifeHosting? *</label>
            <textarea id="razonPartner" placeholder="¿Qué te llamó la atención de nosotros? ¿Cómo nuestros servicios benefician a tu comunidad?" required></textarea>
        </div>

        <!-- Propuesta de Marketing -->
        <div class="section-title">4. Propuesta de Marketing</div>
        <div class="form-group">
            <label for="propuestaMarketing">Canales y Estrategias de Promoción para LifeHosting *</label>
            <textarea id="propuestaMarketing" placeholder="Elabora una propuesta detallada: ¿Dónde nos promocionarás? Menciones en streams, banners, reseñas..." required></textarea>
        </div>
        <div class="form-group">
            <label for="infoAdicional">Información adicional que pueda ser relevante (Opcional)</label>
            <textarea id="infoAdicional" placeholder="Cualquier otra información que consideres útil para la evaluación."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Enviar Aplicación para Partner</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>
</div>

<script>
    // REEMPLAZA ESTA URL CON LA URL DE TU WEBHOOK DE DISCORD
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1550904378767183952/-mYamfOzf391MHDgdOxmK7pHwrAJ6YGQXlkN-OwQmWinnCwaZDyQHw4QUmDUiFPy1p_J';

    document.getElementById('partnerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        submitBtn.disabled = true;
        submitBtn.innerText = 'Enviando postulación...';
        statusMsg.className = 'status-msg';
        statusMsg.style.display = 'none';

        // Capturar valores
        const nombre = document.getElementById('nombre').value;
        const edad = document.getElementById('edad').value;
        const discordTag = document.getElementById('discordTag').value;
        const discordID = document.getElementById('discordID').value || 'No proporcionado';
        const proyectoNombre = document.getElementById('proyectoNombre').value;
        const redes = document.getElementById('redes').value;
        const descripcion = document.getElementById('descripcion').value;
        const planInteres = document.getElementById('planInteres').value;
        const financiamiento = document.querySelector('input[name="financiamiento"]:checked')?.value || 'No especificado';
        const razonPartner = document.getElementById('razonPartner').value;
        const propuestaMarketing = document.getElementById('propuestaMarketing').value;
        const infoAdicional = document.getElementById('infoAdicional').value || 'Ninguna';

        // Estructura del Embed para Discord
        const payload = {
            username: "LifeHosting - Partner Bot",
            avatar_url: "https://i.imgur.com/4M34hi2.png", // Puedes cambiar este avatar
            embeds: [
                {
                    title: "🚀 Nueva Postulación para Partner",
                    color: 3881718, // Color azul en formato decimal (#3b82f6)
                    fields: [
                        { name: "👤 Nombre", value: nombre, inline: true },
                        { name: "🎂 Edad", value: edad, inline: true },
                        { name: "💬 Discord Tag / ID", value: `${discordTag} (${discordID})`, inline: true },
                        { name: "📌 Proyecto / Organización", value: proyectoNombre, inline: false },
                        { name: "🔗 Redes / Enlaces", value: redes, inline: false },
                        { name: "📖 Descripción del Proyecto", value: descripcion, inline: false },
                        { name: "🛠️ Servicio de Interés", value: planInteres, inline: true },
                        { name: "💰 Financiamiento Total", value: financiamiento, inline: true },
                        { name: "❓ ¿Por qué LifeHosting?", value: razonPartner, inline: false },
                        { name: "📢 Propuesta de Marketing", value: propuestaMarketing, inline: false },
                        { name: "ℹ️ Info Adicional", value: infoAdicional, inline: false }
                    ],
                    footer: {
                        text: "LifeHosting Partner System"
                    },
                    timestamp: new Date().toISOString()
                }
            ]
        };

        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok || response.status === 204) {
                statusMsg.textContent = '¡Tu postulación ha sido enviada con éxito! El staff la revisará pronto.';
                statusMsg.classList.add('success');
                document.getElementById('partnerForm').reset();
            } else {
                throw new Error('Error al enviar la información a Discord.');
            }
        } catch (error) {
            console.error(error);
            statusMsg.textContent = 'Hubo un error al enviar el formulario. Asegúrate de configurar la URL del Webhook correctamente.';
            statusMsg.classList.add('error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Enviar Aplicación para Partner';
        }
    });
</script>

</body>
</html>
